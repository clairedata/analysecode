[project]
name = "analyscode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "clairedata", email = "clairedata2026@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.37.0",
    "pytest>=9.1.1",
]

[project.scripts]
analyscode = "analyscode:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
